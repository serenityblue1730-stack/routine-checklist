<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4f0">
<title>엄마·아이 투트랙 루틴 &amp; 학습 로드맵</title>
<style>
:root{
  --bg:#f7f4f0;
  --card:#ffffff;
  --ink:#3d3a36;
  --sub:#8f8880;
  --line:#eae4dc;
  --mom:#c08a97;
  --mom-soft:#f6ebef;
  --mom-deep:#a96b7b;
  --kid:#7fa78f;
  --kid-soft:#eaf1ec;
  --kid-deep:#5f8a73;
  --gold:#d9a441;
  --danger:#c07a6a;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:'Apple SD Gothic Neo','Pretendard','Malgun Gothic','맑은 고딕',-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.45;
  padding-bottom:40px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px;}

/* ── header ─────────────────────────── */
header.top{
  position:sticky;top:0;z-index:20;
  background:rgba(247,244,240,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.top-inner{max-width:560px;margin:0 auto;padding:12px 14px 0;}
h1{font-size:19px;font-weight:800;letter-spacing:-.3px;}
.top-sub{font-size:12px;color:var(--sub);margin-top:2px;}
nav.tabs{display:flex;gap:6px;margin-top:12px;}
nav.tabs button{
  flex:1;border:none;background:transparent;color:var(--sub);
  font:inherit;font-size:13.5px;font-weight:700;
  padding:10px 4px 11px;cursor:pointer;border-radius:12px 12px 0 0;
  border-bottom:2.5px solid transparent;
}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);}

/* ── day chips ──────────────────────── */
.daybar{display:flex;gap:6px;margin:16px 0 4px;}
.daybar button{
  flex:1;border:1px solid var(--line);background:var(--card);color:var(--sub);
  font:inherit;font-size:14px;font-weight:700;padding:9px 0;cursor:pointer;border-radius:12px;
}
.daybar button.today-mark{border-style:dashed;border-color:var(--gold);color:var(--gold);}
.daybar button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.date-line{font-size:13px;color:var(--sub);margin:10px 2px 2px;font-weight:600;}
.date-line b{color:var(--ink);}

/* ── track toggle ───────────────────── */
.trackbar{display:flex;gap:8px;margin:10px 0 14px;}
.trackbar button{
  flex:1;border:1.5px solid var(--line);background:var(--card);
  font:inherit;cursor:pointer;border-radius:var(--radius);padding:11px 14px 12px;text-align:left;
}
.trackbar button .tname{font-size:14.5px;font-weight:800;}
.trackbar button .tpct{float:right;font-size:13px;font-weight:800;}
.trackbar button.mom.on{border-color:var(--mom);background:var(--mom-soft);}
.trackbar button.mom.on .tname,.trackbar button.mom.on .tpct{color:var(--mom-deep);}
.trackbar button.kid.on{border-color:var(--kid);background:var(--kid-soft);}
.trackbar button.kid.on .tname,.trackbar button.kid.on .tpct{color:var(--kid-deep);}
.gauge{height:5px;border-radius:3px;background:#efe9e2;margin-top:8px;overflow:hidden;}
.gauge i{display:block;height:100%;border-radius:3px;background:var(--mom);}
.trackbar button.kid .gauge i{background:var(--kid);}

/* ── items ──────────────────────────── */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:8px;margin-bottom:12px;box-shadow:0 1px 2px rgba(80,70,60,.04);
}
.sec-head{font-size:13px;font-weight:800;color:var(--sub);letter-spacing:-.2px;margin:16px 4px 8px;}
.item{
  display:flex;align-items:flex-start;gap:11px;width:100%;
  border:none;background:transparent;font:inherit;text-align:left;cursor:pointer;
  padding:12px 10px;border-radius:13px;
}
.item:active{background:#f4f0ea;}
.item + .item{border-top:1px solid #f3efe9;}
.cbox{
  flex:0 0 auto;width:25px;height:25px;margin-top:1px;border-radius:50%;
  border:2px solid #d8d1c7;color:transparent;font-size:14px;font-weight:900;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.item.done .cbox{background:var(--acc,#7fa78f);border-color:var(--acc,#7fa78f);color:#fff;}
.ibody{flex:1;min-width:0;}
.time{
  display:inline-block;font-size:11.5px;font-weight:800;color:var(--sub);
  background:#f3efe9;border-radius:7px;padding:2px 8px;margin-bottom:3px;letter-spacing:.2px;
}
.ititle{display:block;font-size:15px;font-weight:700;letter-spacing:-.2px;}
.item.done .ititle{color:#b5aea4;text-decoration:line-through;text-decoration-thickness:1.5px;}
.isub{display:block;font-size:12.5px;color:var(--sub);margin-top:2px;}
.item.tag .time{background:var(--acc-soft,#faf3e4);color:#a97f2e;}

/* focus block */
.focusblock{
  border:1.5px dashed #d9d2c8;border-radius:14px;padding:6px;margin:2px 6px 10px;
  background:#fbf9f6;
}
.focuslabel{
  font-size:12px;font-weight:800;color:#9a938a;padding:8px 12px 0;letter-spacing:-.2px;
}

/* collection chips */
.collwrap{padding:10px 12px 12px;}
.collwrap .clabel{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:7px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chips button{
  border:1.5px solid var(--line);background:#fff;color:var(--ink);
  font:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;cursor:pointer;
}
.chips button.on{border-color:var(--kid-deep);background:var(--kid-soft);color:var(--kid-deep);}

/* ── weekly ─────────────────────────── */
.wrow{padding:13px 14px;}
.wrow + .wrow{border-top:1px solid #f3efe9;}
.wtop{display:flex;align-items:baseline;gap:8px;}
.wname{font-size:14.5px;font-weight:800;flex:1;}
.wcount{font-size:13px;font-weight:800;color:var(--sub);}
.wcount b{font-size:16px;color:var(--ink);}
.wbar{height:6px;border-radius:3px;background:#efe9e2;margin:9px 0 9px;overflow:hidden;}
.wbar i{display:block;height:100%;border-radius:3px;background:var(--kid);}
.wrow.mom .wbar i{background:var(--mom);}
.dots{display:flex;gap:5px;}
.dots span{
  flex:1;text-align:center;font-size:10.5px;color:#b9b2a8;font-weight:700;
  padding:4px 0;border-radius:8px;background:#f6f2ec;
}
.dots span.hit{background:var(--kid);color:#fff;}
.wrow.mom .dots span.hit{background:var(--mom);}
.weekly-note{font-size:12px;color:var(--sub);margin:2px 6px 14px;}

/* ── roadmap ────────────────────────── */
.done-badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.done-badges span{
  font-size:12.5px;font-weight:800;color:#6d8f6d;background:#eef3ea;
  border:1px solid #dde6d8;border-radius:999px;padding:6px 12px;
}
.stage{padding:14px;}
.stage + .stage{border-top:1px solid #f3efe9;}
.stage-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.stage-head .st-title{font-size:15px;font-weight:800;flex:1;min-width:180px;}
.stage-head .st-pct{font-size:12.5px;font-weight:800;color:var(--sub);}
.stage-head .st-pct b{color:var(--kid-deep);font-size:14px;}
.st-period{display:inline-block;font-size:11.5px;font-weight:800;color:#a97f2e;background:#faf3e4;border-radius:7px;padding:2px 8px;}
.stage .mini{margin-top:4px;}
.mini .item{padding:10px 8px;border-radius:10px;}
.mini .ititle{font-size:14px;font-weight:600;}
.mini .cbox{width:22px;height:22px;font-size:12px;}
.stage .wbar{margin:10px 2px 2px;}

.vol{padding:13px 14px;}
.vol + .vol{border-top:1px solid #f3efe9;}
.vol-head{display:flex;align-items:baseline;gap:8px;}
.vol-name{font-size:15px;font-weight:800;flex:1;}
.vol-name small{font-size:11px;color:var(--sub);font-weight:700;margin-left:5px;}
.vol-badge{font-size:11.5px;font-weight:800;color:#fff;background:var(--kid);border-radius:999px;padding:3px 10px;display:none;}
.vol.full .vol-badge{display:inline-block;}
.unitrow{display:flex;align-items:center;gap:10px;margin:10px 0 9px;}
.unitbtn{
  width:38px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
  font:inherit;font-size:19px;font-weight:800;color:var(--ink);cursor:pointer;line-height:1;
}
.unitbtn:active{background:#f0ebe4;}
.unitnum{flex:1;text-align:center;font-size:15px;font-weight:800;}
.unitnum small{font-size:12px;color:var(--sub);font-weight:700;}
.vol .wbar{margin:0 0 10px;}
.vol textarea{
  width:100%;border:1.5px solid var(--line);border-radius:11px;background:#fbf9f6;
  font:inherit;font-size:13.5px;padding:9px 11px;resize:none;color:var(--ink);
}
.vol textarea:focus{outline:none;border-color:var(--kid);}
.lv-head{
  display:flex;align-items:center;gap:8px;margin:18px 4px 8px;
}
.lv-head .lv-tag{font-size:12px;font-weight:800;color:#fff;background:var(--kid-deep);border-radius:8px;padding:3px 9px;}
.lv-head .lv-note{font-size:12px;color:var(--sub);font-weight:600;}

/* ── misc ───────────────────────────── */
.btnrow{display:flex;gap:8px;margin:18px 0 8px;}
.btnrow button{
  flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--sub);
  font:inherit;font-size:13px;font-weight:700;padding:11px 0;border-radius:13px;cursor:pointer;
}
.btnrow button:active{background:#f0ebe4;}
.empty{padding:18px 6px;font-size:13.5px;color:var(--sub);}
section.tabpane{display:none;}
section.tabpane.on{display:block;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <h1>오늘도 함께, 루틴 체크</h1>
    <div class="top-sub">👩 엄마 &amp; 👧 아이 · 체크하면 자동 저장돼요</div>
    <nav class="tabs" id="tabs">
      <button data-tab="today" class="on">오늘의 루틴</button>
      <button data-tab="week">주간 한눈에</button>
      <button data-tab="road">학습 로드맵</button>
    </nav>
  </div>
</header>

<div class="wrap">

  <!-- 오늘의 루틴 -->
  <section class="tabpane on" id="pane-today">
    <div class="daybar" id="daybar"></div>
    <div class="date-line" id="dateLine"></div>
    <div class="trackbar" id="trackbar"></div>
    <div id="routineView"></div>
    <div class="btnrow">
      <button id="resetDay">선택한 날 초기화</button>
      <button id="resetWeek">이번 주 초기화</button>
    </div>
  </section>

  <!-- 주간 한눈에 -->
  <section class="tabpane" id="pane-week">
    <div class="sec-head">👩 엄마</div>
    <div class="card" id="weekMom"></div>
    <div class="sec-head">👧 아이</div>
    <div class="card" id="weekKid"></div>
    <div class="weekly-note">동화책은 하루 2권 · 주간 목표 14권. 점 하나가 하루예요(월→일).</div>
    <div class="btnrow"><button id="resetWeek2">이번 주 초기화</button></div>
  </section>

  <!-- 학습 로드맵 -->
  <section class="tabpane" id="pane-road">
    <div class="sec-head">📖 한글 로드맵 · 2026년 11월 ~ 2027년 3월 (주 3회)</div>
    <div class="done-badges">
      <span>✓ 이름 알기</span>
      <span>✓ 자음 거꾸로 ㅋ·ㅌ·ㅍ·ㅎ</span>
    </div>
    <div class="card" id="hangulCard"></div>

    <div class="sec-head">🔢 수학 로드맵 · 팩토슐레 1·2단계 (주 2회)</div>
    <div class="weekly-note">출판사 권장 순서: 도형 → 수 → 규칙 → 연산 → 측정 → 문제해결력 · 각 권 30 유닛</div>
    <div class="lv-head"><span class="lv-tag">1단계</span><span class="lv-note">4~5세 · 먼저 시작</span></div>
    <div class="card" id="mathL1"></div>
    <div class="lv-head"><span class="lv-tag">2단계</span><span class="lv-note">5~6세 · 1단계 후에</span></div>
    <div class="card" id="mathL2"></div>
    <div style="height:16px"></div>
  </section>

</div>

<script>
'use strict';
/* ───────────────────────── data ───────────────────────── */
var LS_KEY = 'routine5yo_v1';
var DOWS = ['월','화','수','목','금','토','일'];
var COLLECTIONS = ['과학공룡','수학특공대','이야기마법사','안녕마음아','버니의세계책방'];

var MATH_VOLS = [
  {id:'L1_shape',   lv:1, name:'도형',      en:'SHAPES'},
  {id:'L1_num',     lv:1, name:'수',        en:'NUMBERS'},
  {id:'L1_pattern', lv:1, name:'규칙',      en:'PATTERNS'},
  {id:'L1_op',      lv:1, name:'연산',      en:'OPERATIONS'},
  {id:'L1_measure', lv:1, name:'측정',      en:'MEASUREMENT'},
  {id:'L1_solve',   lv:1, name:'문제해결력', en:'PROBLEM SOLVING'},
  {id:'L2_shape',   lv:2, name:'도형',      en:'SHAPES'},
  {id:'L2_num',     lv:2, name:'수',        en:'NUMBERS'},
  {id:'L2_pattern', lv:2, name:'규칙',      en:'PATTERNS'},
  {id:'L2_op',      lv:2, name:'연산',      en:'OPERATIONS'},
  {id:'L2_measure', lv:2, name:'측정',      en:'MEASUREMENT'},
  {id:'L2_solve',   lv:2, name:'문제해결력', en:'PROBLEM SOLVING'}
];

var HANGUL_STAGES = [
  {title:'나머지 자음 거꾸로 완성', period:'11월 말 ~ 12월 초',
   items:['ㅇ·ㅈ·ㅊ 거꾸로 쓰기','ㅁ·ㅂ·ㅅ 거꾸로 쓰기','ㄱ·ㄴ·ㄷ·ㄹ 거꾸로 쓰기']},
  {title:'기본 모음 집중 구분', period:'12월 중순 ~ 1월 초',
   items:['ㅏ·ㅓ·ㅗ·ㅜ·ㅡ·ㅣ 소리 익히기','ㅑ·ㅕ·ㅛ·ㅠ 소리 익히기','모양·소리 짝짓기 놀이로 구분하기']},
  {title:'자음+모음 합쳐 읽기', period:'1월 중순 ~ 2월 초',
   items:['자음+모음 조합 소리 내어 읽기','받침 없는 2글자 낱말 읽기','전집 제목 짚어 읽기']},
  {title:'받침·쌍자음 & 문장 읽기 완성', period:'2월 중순 ~ 3월',
   items:['대표 받침 소리 익히기','쌍자음(ㄲ·ㄸ·ㅃ·ㅆ·ㅉ) 구분하기','짧은 그림책 문장 스스로 읽기 🎉']}
];

/* ───────────────────── routine items ──────────────────── */
function momTasks(dow){
  if(dow <= 4){ /* 평일 */
    var t = [
      {id:'m_wake', time:'05:30', title:'기상 · 물 한 잔 / 가벼운 스트레칭'}
    ];
    if(dow >= 1){
      t.push({id:'m_box', time:'05:45~06:05', title:'아침 도시락 싸기',
              sub:'20분 이내 · 샌드위치/냉동밥', tag:'도시락'});
    }
    t.push(
      {id:'m_work',  time:'06:30',       title:'출근', sub:'08:30~18:20 근무'},
      {id:'m_go',    time:'18:20',       title:'퇴근 → 아이 픽업 → 귀가', sub:'19:40~50 픽업 · 20:10 귀가'},
      {id:'m_wash',  time:'20:10~20:30', title:'아이 씻기기'},
      {id:'m_dinner',time:'20:30~21:20', title:'내 저녁 식사 & 아이 간식·루틴 함께'},
      {id:'m_bed',   time:'21:20',       title:'아이 재우기'},
      {id:'m_ex',    time:'21:25~',      title:'짧은 운동 20~30분', sub:'주 3회 목표 · 이번 주 확인은 주간 탭에서', tag:'운동'}
    );
    return t;
  }
  /* 주말 */
  return [
    {id:'m_wk_wake', time:'아침', title:'아이와 여유 기상 · 식사'},
    {id:'m_wk_act',  time:'낮',   title:'아이와 주말 활동', sub:'체험 · 나들이 · 집 놀이'},
    {id:'m_ex',      time:'여유 시간', title:'짧은 운동 20~30분', sub:'주 3회 목표 · 주말에도 OK', tag:'운동'}
  ];
}

function kidTasks(dow){
  var isHangulDay = (dow === 0 || dow === 2 || dow === 4); /* 월·수·금 */
  var bookTime;
  if(dow <= 4){
    var mission = isHangulDay
      ? {id:'k_hangul', time:'20:30~20:50', title:'한글 놀이 20분',
         sub:'오늘의 미션 · 자음 거꾸로/모음/낱말 놀이', tag:'한글'}
      : {id:'k_math', time:'20:30~20:50', title:'수학 팩토슐레 20분',
         sub:'오늘의 미션 · 진도 나온 유닛', tag:'수학'};
    var t = [
      {id:'k_morning', time:'07:30~08:00',
       title:'기상 · 화장실 · 세수/양치 · 옷입기 · 아침식사 · 유치원 등원'},
      {id:'k_home', time:'19:40~20:10',
       title:'픽업 → 귀가 · 씻기', sub:'19:40~50 엄마 픽업 · 20:00~10 귀가 후 씻기'},
      mission
    ];
    if(!isHangulDay){
      t.push({id:'k_eng', time:'20:50~21:00', title:'유치원 영어 복습 10분',
              sub:'오늘 배운 것 따라 읽기', tag:'영어'});
      bookTime = '21:00~21:20';
    } else {
      bookTime = '20:50~21:20';
    }
    t.push(
      {id:'k_book1', time:bookTime, title:'동화책 1권', sub:'엄마랑 소리 내어 읽기'},
      {id:'k_book2', time:bookTime, title:'동화책 2권', sub:'다 읽으면 오늘의 미선 스티커!'},
      {collections:true},
      {id:'k_sleep', time:'21:20', title:'취침', sub:'편안한 잠옷 · 불 끄고 곤히 자기'}
    );
    return t;
  }
  if(dow === 5){ /* 토 */
    return [
      {id:'k_art', time:'주말 자유 시간', title:'미술 놀이', sub:'물감·클레이·자유 그리기 · 미술 대회 그림도 OK', tag:'미술'},
      {id:'k_book1', time:'취침 전', title:'동화책 1권', sub:'엄마랑 소리 내어 읽기'},
      {id:'k_book2', time:'취침 전', title:'동화책 2권', sub:'다 읽으면 오늘의 미선 스티커!'},
      {collections:true}
    ];
  }
  /* 일 */
  return [
    {id:'k_free', time:'하루 종일', title:'가족 자유의 날', sub:'휴식 · 나들이 · 야외 놀이 · 공부 없는 날'},
    {id:'k_book1', time:'취침 전', title:'동화책 1권', sub:'엄마랑 소리 내어 읽기'},
    {id:'k_book2', time:'취침 전', title:'동화책 2권', sub:'다 읽으면 오늘의 미선 스티커!'},
    {collections:true}
  ];
}

/* ───────────────────── state & dates ──────────────────── */
function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){
      var s = JSON.parse(raw);
      return {
        checks: s.checks || {},
        collections: s.collections || {},
        hangul: s.hangul || {},
        math: s.math || {},
        mathMemo: s.mathMemo || {}
      };
    }
  }catch(e){}
  return {checks:{}, collections:{}, hangul:{}, math:{}, mathMemo:{}};
}
var state = loadState();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

function pad2(n){ return (n < 10 ? '0' : '') + n; }
function dstr(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function dowOfDateStr(ds){
  var p = ds.split('-');
  return (new Date(+p[0], +p[1]-1, +p[2]).getDay() + 6) % 7; /* 월=0 */
}
function todayDow(){ return (new Date().getDay() + 6) % 7; }
function weekDates(){
  var now = new Date();
  var mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay()+6)%7));
  var out = [];
  for(var i = 0; i < 7; i++){
    var d = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i);
    out.push(dstr(d));
  }
  return out;
}
function dateOfDow(dow){
  var now = new Date();
  var mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay()+6)%7));
  return new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + dow);
}

var selDow = todayDow();
var selTrack = 'kid';

/* ───────────────────── helpers ────────────────────────── */
function getChecks(ds){
  if(!state.checks[ds]) state.checks[ds] = {};
  return state.checks[ds];
}
function trackIds(dow, track){
  var list = (track === 'mom') ? momTasks(dow) : kidTasks(dow);
  var ids = [];
  for(var i = 0; i < list.length; i++){
    if(list[i].id) ids.push(list[i].id);
  }
  return ids;
}
function trackProgress(ds, track){
  var ids = trackIds(dowOfDateStr(ds), track);
  var c = state.checks[ds] || {};
  var done = 0;
  for(var i = 0; i < ids.length; i++){ if(c[ids[i]]) done++; }
  return {done: done, total: ids.length};
}

/* ───────────────────── render: today ──────────────────── */
function itemHTML(t, checks, acc, accSoft){
  if(t.collections){
    var sel = state.collections[curDS()] || [];
    var chips = '';
    for(var i = 0; i < COLLECTIONS.length; i++){
      var name = COLLECTIONS[i];
      var on = sel.indexOf(name) >= 0;
      chips += '<button class="' + (on ? 'on' : '') + '" data-coll="' + name + '">' + name + '</button>';
    }
    return '<div class="collwrap"><div class="clabel">📚 오늘 읽은 전집 태그하기</div>' +
           '<div class="chips">' + chips + '</div></div>';
  }
  var done = !!checks[t.id];
  return '<button class="item' + (done ? ' done' : '') + (t.tag ? ' tag' : '') + '" data-task="' + t.id + '"' +
         ' style="--acc:' + acc + ';--acc-soft:' + accSoft + '">' +
    '<span class="cbox">✓</span>' +
    '<span class="ibody">' +
      (t.time ? '<span class="time">' + t.time + '</span>' : '') +
      '<span class="ititle">' + t.title + '</span>' +
      (t.sub ? '<span class="isub">' + t.sub + '</span>' : '') +
    '</span>' +
  '</button>';
}

function renderDaybar(){
  var html = '';
  var tDow = todayDow();
  for(var i = 0; i < 7; i++){
    html += '<button data-dow="' + i + '" class="' + (i === selDow ? 'on' : '') +
            (i === tDow ? ' today-mark' : '') + '">' + DOWS[i] + '</button>';
  }
  document.getElementById('daybar').innerHTML = html;
}

function renderTrackbar(){
  var ds = curDS();
  var mom = trackProgress(ds, 'mom');
  var kid = trackProgress(ds, 'kid');
  var momPct = mom.total ? Math.round(mom.done / mom.total * 100) : 0;
  var kidPct = kid.total ? Math.round(kid.done / kid.total * 100) : 0;
  document.getElementById('trackbar').innerHTML =
    '<button class="mom' + (selTrack === 'mom' ? ' on' : '') + '" data-track="mom">' +
      '<span class="tname">👩 엄마</span><span class="tpct">' + momPct + '%</span>' +
      '<span class="gauge"><i style="width:' + momPct + '%"></i></span>' +
    '</button>' +
    '<button class="kid' + (selTrack === 'kid' ? ' on' : '') + '" data-track="kid">' +
      '<span class="tname">👧 아이</span><span class="tpct">' + kidPct + '%</span>' +
      '<span class="gauge"><i style="width:' + kidPct + '%"></i></span>' +
    '</button>';
}

function renderRoutine(){
  var dow = selDow;
  var ds = curDS();
  var checks = state.checks[ds] || {};
  var d = dateOfDow(dow);
  document.getElementById('dateLine').innerHTML =
    '<b>' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + DOWS[dow] + ')</b>' +
    (dow === todayDow() ? ' · 오늘' : '');

  var acc, accSoft, accDeep, list, head;
  if(selTrack === 'mom'){
    acc = 'var(--mom)'; accSoft = 'var(--mom-soft)'; accDeep = 'var(--mom-deep)';
    list = momTasks(dow);
    head = (dow <= 4) ? '👩 엄마 평일 루틴' : '👩 엄마 주말 루틴';
  } else {
    acc = 'var(--kid)'; accSoft = 'var(--kid-soft)'; accDeep = 'var(--kid-deep)';
    list = kidTasks(dow);
    head = '👧 아이 ' + (dow <= 4 ? '평일' : '주말') + ' 루틴';
  }

  var html = '';
  if(selTrack === 'kid' && dow <= 4){
    /* 아이 평일: 기상~씻기 / 저녁 집중 루틴(20:30~21:20) / 취침 구분 */
    var focusItems = [];
    var rest = [];
    var inFocus = false;
    for(var i = 0; i < list.length; i++){
      var t = list[i];
      var isFocus = t.id === 'k_hangul' || t.id === 'k_math' || t.id === 'k_eng' ||
                    t.id === 'k_book1' || t.id === 'k_book2' || !!t.collections;
      if(isFocus){ focusItems.push(t); inFocus = true; }
      else {
        if(inFocus){ rest.push({focus:true, items:focusItems.slice()}); focusItems = []; inFocus = false; }
        rest.push(t);
      }
    }
    if(focusItems.length) rest.push({focus:true, items:focusItems});

    html += '<div class="sec-head">' + head + '</div><div class="card">';
    var focusOpen = false;
    for(var j = 0; j < rest.length; j++){
      var it = rest[j];
      if(it.focus){
        if(focusOpen){ html += '</div></div>'; focusOpen = false; }
        html += '<div class="focusblock"><div class="focuslabel">🌙 저녁 집중 루틴 · 간식 먹으며 20:30~21:20</div><div>';
        focusOpen = true;
        for(var k = 0; k < it.items.length; k++){
          html += itemHTML(it.items[k], checks, acc, accSoft);
        }
        if(j === rest.length - 1){ html += '</div></div>'; focusOpen = false; }
      } else {
        if(focusOpen){ html += '</div></div>'; focusOpen = false; }
        html += itemHTML(it, checks, acc, accSoft);
      }
    }
    if(focusOpen) html += '</div></div>';
    html += '</div>';
  } else {
    html += '<div class="sec-head">' + head + '</div><div class="card">';
    for(var m = 0; m < list.length; m++){
      html += itemHTML(list[m], checks, acc, accSoft);
    }
    html += '</div>';
  }

  document.getElementById('routineView').innerHTML = html;
  document.getElementById('resetDay').textContent =
    (selDow === todayDow() ? '오늘 초기화' : DOWS[selDow] + '요일 초기화');
}

function renderToday(){
  renderDaybar();
  renderTrackbar();
  renderRoutine();
}

/* ───────────────────── render: weekly ─────────────────── */
var WEEK_ROWS = [
  {group:'mom', label:'주 3회 운동', target:3, ids:['m_ex']},
  {group:'mom', label:'도시락 싸기 (화~금)', target:4, ids:['m_box']},
  {group:'kid', label:'한글 놀이 (월·수·금)', target:3, ids:['k_hangul']},
  {group:'kid', label:'수학 팩토슐레 (화·목)', target:2, ids:['k_math']},
  {group:'kid', label:'유치원 영어 (화·목)', target:2, ids:['k_eng']},
  {group:'kid', label:'미술 놀이 (토)', target:1, ids:['k_art']}
];

function rowHTML(row){
  var dss = weekDates();
  var n = 0;
  var dots = '';
  for(var i = 0; i < 7; i++){
    var c = state.checks[dss[i]] || {};
    var hit = true;
    for(var j = 0; j < row.ids.length; j++){
      if(!c[row.ids[j]]){ hit = false; break; }
    }
    if(hit) n++;
    dots += '<span class="' + (hit ? 'hit' : '') + '">' + DOWS[i] + '</span>';
  }
  var pct = Math.min(100, Math.round(n / row.target * 100));
  return '<div class="wrow ' + row.group + '">' +
    '<div class="wtop"><span class="wname">' + row.label + '</span>' +
    '<span class="wcount"><b>' + n + '</b> / ' + row.target + '</span></div>' +
    '<div class="wbar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="dots">' + dots + '</div>' +
  '</div>';
}

function renderWeek(){
  var mom = '', kid = '';
  for(var i = 0; i < WEEK_ROWS.length; i++){
    if(WEEK_ROWS[i].group === 'mom') mom += rowHTML(WEEK_ROWS[i]);
    else kid += rowHTML(WEEK_ROWS[i]);
  }
  /* 동화책: 하루 2권 */
  var dss = weekDates();
  var books = 0, bdots = '';
  for(var d = 0; d < 7; d++){
    var c = state.checks[dss[d]] || {};
    var dayN = (c.k_book1 ? 1 : 0) + (c.k_book2 ? 1 : 0);
    books += dayN;
    bdots += '<span class="' + (dayN === 2 ? 'hit' : '') + '">' + DOWS[d] + '</span>';
  }
  var bpct = Math.min(100, Math.round(books / 14 * 100));
  kid += '<div class="wrow kid">' +
    '<div class="wtop"><span class="wname">동화책 읽기 (매일 2권)</span>' +
    '<span class="wcount"><b>' + books + '</b> / 14권</span></div>' +
    '<div class="wbar"><i style="width:' + bpct + '%"></i></div>' +
    '<div class="dots">' + bdots + '</div></div>';

  document.getElementById('weekMom').innerHTML = mom || '<div class="empty">기록 없음</div>';
  document.getElementById('weekKid').innerHTML = kid || '<div class="empty">기록 없음</div>';
}

/* ───────────────────── render: roadmap ────────────────── */
function renderHangul(){
  var html = '';
  for(var s = 0; s < HANGUL_STAGES.length; s++){
    var st = HANGUL_STAGES[s];
    var done = 0, items = '';
    for(var i = 0; i < st.items.length; i++){
      var id = 'h' + s + '_' + i;
      var on = !!state.hangul[id];
      if(on) done++;
      items += '<button class="item' + (on ? ' done' : '') + '" data-hangul="' + id + '"' +
               ' style="--acc:var(--kid);--acc-soft:var(--kid-soft)">' +
        '<span class="cbox">✓</span><span class="ibody"><span class="ititle">' + st.items[i] + '</span></span>' +
      '</button>';
    }
    var pct = Math.round(done / st.items.length * 100);
    html += '<div class="stage">' +
      '<div class="stage-head">' +
        '<span class="st-title">' + (s+1) + '단계 · ' + st.title + '</span>' +
        '<span class="st-pct"><b>' + done + '</b>/' + st.items.length + '</span>' +
      '</div>' +
      '<div style="margin-top:6px"><span class="st-period">' + st.period + '</span></div>' +
      '<div class="wbar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="mini">' + items + '</div>' +
    '</div>';
  }
  document.getElementById('hangulCard').innerHTML = html;
}

function volHTML(v){
  var units = state.math[v.id] || 0;
  var memo = state.mathMemo[v.id] || '';
  var pct = Math.round(units / 30 * 100);
  return '<div class="vol' + (units >= 30 ? ' full' : '') + '">' +
    '<div class="vol-head">' +
      '<span class="vol-name">' + v.name + '<small>' + v.en + '</small></span>' +
      '<span class="vol-badge">완료 ✓</span>' +
    '</div>' +
    '<div class="unitrow">' +
      '<button class="unitbtn" data-unit="' + v.id + '" data-delta="-1">−</button>' +
      '<span class="unitnum">' + units + ' <small>/ 30 유닛</small></span>' +
      '<button class="unitbtn" data-unit="' + v.id + '" data-delta="1">＋</button>' +
    '</div>' +
    '<div class="wbar"><i style="width:' + pct + '%"></i></div>' +
    '<textarea rows="2" data-memo="' + v.id + '" placeholder="이번 권 메모 · 다시 할 활동, 어려웠던 유닛 등">' + escHtml(memo) + '</textarea>' +
  '</div>';
}
function renderMath(){
  var l1 = '', l2 = '';
  for(var i = 0; i < MATH_VOLS.length; i++){
    if(MATH_VOLS[i].lv === 1) l1 += volHTML(MATH_VOLS[i]);
    else l2 += volHTML(MATH_VOLS[i]);
  }
  document.getElementById('mathL1').innerHTML = l1;
  document.getElementById('mathL2').innerHTML = l2;
}

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderRoad(){
  renderHangul();
  renderMath();
}

/* ───────────────────── events ─────────────────────────── */
function curDS(){ return dstr(dateOfDow(selDow)); }

document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button[data-tab]');
  if(!b) return;
  var tab = b.getAttribute('data-tab');
  var btns = document.querySelectorAll('#tabs button');
  for(var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i] === b);
  var panes = document.querySelectorAll('.tabpane');
  for(var j = 0; j < panes.length; j++) panes[j].classList.remove('on');
  document.getElementById('pane-' + tab).classList.add('on');
  if(tab === 'week') renderWeek();
  if(tab === 'road') renderRoad();
});

document.getElementById('daybar').addEventListener('click', function(e){
  var b = e.target.closest('button[data-dow]');
  if(!b) return;
  selDow = +b.getAttribute('data-dow');
  renderToday();
});

document.getElementById('trackbar').addEventListener('click', function(e){
  var b = e.target.closest('button[data-track]');
  if(!b) return;
  selTrack = b.getAttribute('data-track');
  renderToday();
});

document.getElementById('routineView').addEventListener('click', function(e){
  var task = e.target.closest('[data-task]');
  if(task){
    var ds = curDS();
    var c = getChecks(ds);
    var id = task.getAttribute('data-task');
    if(c[id]) delete c[id]; else c[id] = 1;
    save();
    renderToday();
    return;
  }
  var coll = e.target.closest('[data-coll]');
  if(coll){
    var ds2 = curDS();
    var name = coll.getAttribute('data-coll');
    var arr = state.collections[ds2] || [];
    var idx = arr.indexOf(name);
    if(idx >= 0) arr.splice(idx, 1); else arr.push(name);
    state.collections[ds2] = arr;
    save();
    renderRoutine();
  }
});

document.getElementById('hangulCard').addEventListener('click', function(e){
  var b = e.target.closest('[data-hangul]');
  if(!b) return;
  var id = b.getAttribute('data-hangul');
  if(state.hangul[id]) delete state.hangul[id]; else state.hangul[id] = 1;
  save();
  renderHangul();
});

function bindMathCard(elId){
  document.getElementById(elId).addEventListener('click', function(e){
    var b = e.target.closest('[data-unit]');
    if(!b) return;
    var id = b.getAttribute('data-unit');
    var delta = +b.getAttribute('data-delta');
    var cur = state.math[id] || 0;
    cur = Math.max(0, Math.min(30, cur + delta));
    state.math[id] = cur;
    save();
    renderMath();
  });
  document.getElementById(elId).addEventListener('input', function(e){
    var t = e.target.closest('[data-memo]');
    if(!t) return;
    state.mathMemo[t.getAttribute('data-memo')] = t.value;
    save();
  });
}
bindMathCard('mathL1');
bindMathCard('mathL2');

/* ── reset ── */
function clearDates(dss){
  for(var i = 0; i < dss.length; i++){
    delete state.checks[dss[i]];
    delete state.collections[dss[i]];
  }
  save();
}
function resetDay(){
  var label = (selDow === todayDow()) ? '오늘' : DOWS[selDow] + '요일';
  if(!confirm(label + ' 체크를 모두 지울까요?')) return;
  clearDates([curDS()]);
  renderAll();
}
function resetWeek(){
  if(!confirm('이번 주(월~일) 체크를 모두 지울까요?')) return;
  clearDates(weekDates());
  renderAll();
}
document.getElementById('resetDay').addEventListener('click', resetDay);
document.getElementById('resetWeek').addEventListener('click', resetWeek);
document.getElementById('resetWeek2').addEventListener('click', resetWeek);

function renderAll(){
  renderToday();
  renderWeek();
  renderRoad();
}

/* ── init ── */
renderAll();
</script>
